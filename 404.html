<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | Setflow</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E3FAE">
<style>
:root{--royal:#1E3FAE;--ink:#0E1A3D;--muted:#4F5D80;--line:#D9E1EF;--led-r:#E2342D;--led-g:#2EAD4B;--led-b:#1F8FE0;
--bg:#F5F8FC;--surface:#fff;--fg:#0E1A3D;--display:"Arial Black",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#08112B;--surface:#0F1B40;--fg:#EAF0FF;--muted:#A3B1D6;--line:#22336A;--ink:#fff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:400 17px/1.6 var(--body);padding:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(28px,6vw,52px);max-width:560px;width:100%;text-align:center;box-shadow:0 24px 60px -40px rgba(14,26,61,.5)}
.dots{display:inline-flex;gap:5px;margin-bottom:22px}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--led-r)}.dots i:nth-child(2){background:var(--led-g)}.dots i:nth-child(3){background:var(--led-b)}
.code{font:600 clamp(56px,14vw,96px)/1 var(--display);color:var(--royal);letter-spacing:-.04em;margin:0 0 8px}
h1{font:800 clamp(22px,4vw,30px)/1.15 var(--display);margin:0 0 12px;color:var(--ink)}
p{margin:0 0 8px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:700 15px/1 var(--body);padding:14px 22px;border-radius:999px;background:var(--royal);color:#fff;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--royal)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.brand{font:600 12px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:28px;display:block}
</style>
</head>
<body>
<main class="card">
  <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
  <p class="code">404</p>
  <h1>Esta página não existe.</h1>
  <p>O endereço pode ter mudado ou foi digitado com erro. Volte para a página inicial ou fale com a gente direto pelo WhatsApp.</p>
  <div class="actions">
    <a class="btn" href="/">Voltar ao início</a>
    <a class="btn ghost" href="/politica-de-privacidade.html">Política de Privacidade</a>
  </div>
  <span class="brand">Setflow · Automação · IA · Jira · Google Workspace · TI remota</span>
</main>
</body>
</html>
